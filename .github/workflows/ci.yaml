name: CI - GitPulse-Dockerfile

on:
  push:
    branches: [stage]
  pull_request:
    branches: [stage]
  workflow_dispatch:
    inputs:
      run_docker:
        description: Run Docker build and push
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read
  id-token: write

env:
  JF_URL: ${{ vars.JF_URL }}
  IMAGE: jfitgh-bi-portal/GitPulse-Dockerfile
  BUILD_NAME: GitPulse-Dockerfile

jobs:
  build-scan-push:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Configure JFrog CLI
        run: |
          jf c add --url=$JF_URL --access-token=$JF_ACCESS_TOKEN --interactive=false

      - name: Collect build info
        run: jf rt bce $BUILD_NAME ${{ github.run_number }}

      - name: Validate TypeScript (backend)
        continue-on-error: true
        run: |
          if [ -f backend/tsconfig.json ]; then
            cd backend && npx tsc --noEmit -p tsconfig.json
          else
            echo "No backend tsconfig found. Skipping TypeScript validation."
          fi

      - name: Build Docker Image
        if: ${{ github.event.inputs.run_docker == 'true' || vars.ENABLE_DOCKER == 'true' }}
        run: |
          jf docker build -t $IMAGE:${{ github.sha }} -f ./Dockerfile . \
            --build-name=$BUILD_NAME \
            --build-number=${{ github.run_number }}

      - name: Push to Artifactory
        if: ${{ github.event.inputs.run_docker == 'true' || vars.ENABLE_DOCKER == 'true' }}
        run: |
          jf docker push $IMAGE:${{ github.sha }} \
            --build-name=$BUILD_NAME \
            --build-number=${{ github.run_number }}

      - name: Xray Security Scan
        if: ${{ github.event.inputs.run_docker == 'true' || vars.ENABLE_DOCKER == 'true' }}
        run: |
          jf bs $BUILD_NAME ${{ github.run_number }} \
            --fail=true \
            --format=table

      - name: Publish Build Info
        if: ${{ success() && (github.event.inputs.run_docker == 'true' || vars.ENABLE_DOCKER == 'true') }}
        run: jf bp $BUILD_NAME ${{ github.run_number }}